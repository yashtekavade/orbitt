<!DOCTYPE html>
<html lang="en">




<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="theme-color" content="#0a0e14">
  <title>Orbit — nearby, right now</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <link rel="stylesheet"
    href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=Inter:wght@400;500;600&display=swap" />
  <link rel="manifest" href="/manifest.json">
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    :root {
      --ink: #0a0e14;
      --panel: #121824;
      --line: #233047;
      --dim: #8a97ab;
      --text: #e8edf4;
      --signal: #5ff0c8;
      --warn: #ff7a6b;
      --font-d: "Space Grotesk", system-ui, sans-serif;
      --font-b: "Inter", system-ui, sans-serif;
    }




    /* fonts loaded via <link> in <head> */




    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent
    }




    html,
    body {
      margin: 0;
      height: 100%;
      background: var(--ink);
      color: var(--text);
      font-family: var(--font-b);
      overscroll-behavior: none
    }




    #app {
      height: 100dvh;
      display: flex;
      flex-direction: column;
      position: relative
    }




    #map {
      flex: 1;
      background: var(--ink);
      z-index: 0
    }




    .leaflet-tile {
      filter: invert(1) hue-rotate(180deg) brightness(.85) contrast(.9) saturate(.6)
    }




    .leaflet-container {
      background: var(--ink)
    }




    /* top bar */
    .bar {
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      z-index: 500;
      padding: 14px 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: linear-gradient(180deg, rgba(10, 14, 20, .92) 0%, rgba(10, 14, 20, .5) 80%, transparent 100%);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px)
    }




    .brand {
      font-family: var(--font-d);
      font-weight: 700;
      letter-spacing: -.02em;
      font-size: 20px
    }




    .brand span {
      color: var(--signal)
    }




    .ghost {
      font-size: 12px;
      font-weight: 600;
      padding: 7px 12px;
      border-radius: 999px;
      border: 1px solid var(--line);
      background: rgba(18, 24, 36, .65);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      color: var(--dim);
      transition: all .15s ease;
      cursor: pointer
    }




    .ghost:active {
      transform: scale(.91);
      opacity: .8
    }




    .ghost.on {
      color: var(--ink);
      background: var(--signal);
      border-color: var(--signal);
      box-shadow: 0 0 14px rgba(95, 240, 200, .3)
    }




    /* mode switch */
    .modes {
      position: absolute;
      bottom: 18px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 500;
      display: flex;
      gap: 4px;
      background: rgba(18, 24, 36, .7);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid rgba(35, 48, 71, .5);
      padding: 4px;
      border-radius: 999px;
      box-shadow: 0 4px 24px rgba(0, 0, 0, .35)
    }




    .modes button {
      font-family: var(--font-d);
      font-weight: 500;
      font-size: 13px;
      padding: 9px 20px;
      border-radius: 999px;
      border: 0;
      background: transparent;
      color: var(--dim);
      transition: all .2s ease;
      cursor: pointer
    }




    .modes button:active {
      transform: scale(.92)
    }




    .modes button.active {
      background: var(--signal);
      color: var(--ink);
      box-shadow: 0 2px 12px rgba(95, 240, 200, .25)
    }




    /* avatar markers */
    .av {
      width: 38px;
      height: 38px;
      border-radius: 50%;
      border: 2px solid var(--signal);
      background-size: cover;
      background-position: center;
      box-shadow: 0 0 0 6px rgba(95, 240, 200, .12)
    }




    .av.pulse {
      animation: pulse 2s infinite
    }




    @keyframes pulse {
      0% {
        box-shadow: 0 0 0 4px rgba(95, 240, 200, .3);
        transform: scale(1)
      }




      50% {
        transform: scale(1.05)
      }




      70% {
        box-shadow: 0 0 0 18px rgba(95, 240, 200, 0)
      }




      100% {
        box-shadow: 0 0 0 4px rgba(95, 240, 200, 0);
        transform: scale(1)
      }
    }




    .me {
      border-color: #fff;
      box-shadow: 0 0 0 6px rgba(255, 255, 255, .14)
    }




    .av.real {
      border-color: #ffd76b;
      box-shadow: 0 0 0 6px rgba(255, 215, 107, .16)
    }




    /* real live users = gold */
    .av.area {
      border-style: dashed;
      border-color: #ffd76b
    }




    /* my dot when in neighborhood mode */
    .placehint {
      position: absolute;
      top: 64px;
      left: 16px;
      right: 16px;
      z-index: 500;
      text-align: center;
      background: var(--panel);
      border: 1px solid var(--signal);
      border-radius: 12px;
      padding: 11px 14px;
      font-size: 13px;
      color: var(--text);
      display: none
    }




    .placehint.show {
      display: block
    }




    .hub {
      width: 34px;
      height: 34px;
      border-radius: 12px;
      display: grid;
      place-items: center;
      background: var(--panel);
      border: 1px solid var(--line);
      font-size: 16px
    }




    .hub .cnt {
      position: absolute;
      top: -6px;
      right: -6px;
      background: var(--signal);
      color: var(--ink);
      font-size: 10px;
      font-weight: 700;
      padding: 1px 5px;
      border-radius: 999px
    }




    /* sheet */
    .sheet {
      position: absolute;
      left: 0;
      right: 0;
      bottom: 0;
      z-index: 600;
      background: rgba(18, 24, 36, .88);
      backdrop-filter: blur(24px) saturate(1.2);
      -webkit-backdrop-filter: blur(24px) saturate(1.2);
      border-top: 1px solid rgba(35, 48, 71, .5);
      border-radius: 24px 24px 0 0;
      padding: 8px 18px 28px;
      transform: translateY(110%);
      transition: transform .34s cubic-bezier(.32, .72, 0, 1);
      max-height: 85dvh;
      overflow: auto;
      box-shadow: 0 -8px 40px rgba(0, 0, 0, .4)
    }




    .sheet.up {
      transform: translateY(0)
    }




    .grip {
      width: 38px;
      height: 4px;
      background: var(--line);
      border-radius: 9px;
      margin: 6px auto 14px
    }




    .photo {
      width: 100%;
      aspect-ratio: 4/5;
      border-radius: 20px;
      object-fit: cover;
      background: linear-gradient(135deg, #1c2536, #0f1520);
      box-shadow: 0 4px 20px rgba(0, 0, 0, .3)
    }




    .name {
      font-family: var(--font-d);
      font-weight: 700;
      font-size: 22px;
      margin: 14px 0 2px
    }




    .meta {
      color: var(--dim);
      font-size: 13px
    }




    .prompt {
      margin-top: 12px;
      padding: 13px 15px;
      background: rgba(10, 14, 20, .6);
      border: 1px solid var(--line);
      border-radius: 14px
    }




    .prompt .q {
      color: var(--dim);
      font-size: 12px
    }




    .prompt .a {
      font-family: var(--font-d);
      font-weight: 500;
      font-size: 15px;
      margin-top: 3px
    }




    .cta {
      width: 100%;
      margin-top: 16px;
      padding: 15px;
      border: 0;
      border-radius: 14px;
      font-family: var(--font-d);
      font-weight: 700;
      font-size: 16px;
      background: linear-gradient(135deg, var(--signal) 0%, #4de8b8 100%);
      color: var(--ink);
      transition: all .15s ease;
      cursor: pointer;
      box-shadow: 0 4px 16px rgba(95, 240, 200, .2)
    }




    .cta:active:not(:disabled) {
      transform: scale(.97);
      box-shadow: 0 2px 8px rgba(95, 240, 200, .3)
    }




    .cta:disabled {
      background: var(--line);
      color: var(--dim);
      box-shadow: none;
      cursor: not-allowed
    }




    .cta.leave {
      background: transparent;
      border: 1px solid var(--warn);
      color: var(--warn)
    }




    /* fuse timer */
    .fuse {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-top: 14px;
      padding: 13px 15px;
      background: rgba(255, 122, 107, .08);
      border: 1px solid rgba(255, 122, 107, .25);
      border-radius: 14px;
      animation: fuseGlow 2s ease-in-out infinite alternate
    }




    @keyframes fuseGlow {
      from {
        box-shadow: 0 0 0 0 rgba(255, 122, 107, 0)
      }

      to {
        box-shadow: 0 0 18px rgba(255, 122, 107, .1)
      }
    }




    .fuse .t {
      font-family: var(--font-d);
      font-weight: 700;
      font-size: 20px;
      color: var(--warn)
    }




    .fuse .lbl {
      font-size: 12px;
      color: var(--dim)
    }




    /* chat */
    .chat {
      display: flex;
      flex-direction: column;
      gap: 8px;
      margin-top: 12px;
      max-height: 38dvh;
      overflow: auto;
      padding-right: 2px
    }




    .msg {
      max-width: 78%;
      padding: 10px 14px;
      border-radius: 18px;
      font-size: 14px;
      line-height: 1.4;
      animation: msgIn .25s cubic-bezier(.32, .72, 0, 1)
    }




    @keyframes msgIn {
      from {
        opacity: 0;
        transform: translateY(6px) scale(.96)
      }

      to {
        opacity: 1;
        transform: translateY(0) scale(1)
      }
    }




    .msg.them {
      background: rgba(10, 14, 20, .8);
      border: 1px solid var(--line);
      align-self: flex-start;
      border-bottom-left-radius: 4px
    }




    .msg.me {
      background: linear-gradient(135deg, var(--signal), #4de8b8);
      color: var(--ink);
      align-self: flex-end;
      border-bottom-right-radius: 4px;
      box-shadow: 0 2px 8px rgba(95, 240, 200, .15)
    }




    .row {
      display: flex;
      gap: 8px;
      margin-top: 12px
    }




    .row input {
      flex: 1;
      padding: 13px 15px;
      border-radius: 12px;
      border: 1px solid var(--line);
      background: rgba(10, 14, 20, .6);
      color: var(--text);
      font-size: 15px;
      outline: none;
      transition: all .2s ease
    }




    .row input:focus {
      border-color: var(--signal);
      box-shadow: 0 0 0 3px rgba(95, 240, 200, .1)
    }




    .row button {
      padding: 0 18px;
      border: 0;
      border-radius: 12px;
      background: linear-gradient(135deg, var(--signal), #4de8b8);
      color: var(--ink);
      font-weight: 700;
      transition: all .15s ease;
      cursor: pointer
    }




    .row button:active {
      transform: scale(.92)
    }




    .hubhead {
      font-family: var(--font-d);
      font-weight: 700;
      font-size: 20px
    }




    .here {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      margin-top: 12px
    }




    .here .p {
      display: flex;
      align-items: center;
      gap: 7px;
      background: var(--ink);
      border: 1px solid var(--line);
      padding: 6px 11px 6px 6px;
      border-radius: 999px;
      font-size: 13px
    }




    .here .p .d {
      width: 22px;
      height: 22px;
      border-radius: 50%;
      background-size: cover
    }




    /* toast */
    .toast {
      position: absolute;
      top: 64px;
      left: 16px;
      right: 16px;
      z-index: 700;
      background: rgba(18, 24, 36, .85);
      backdrop-filter: blur(20px) saturate(1.2);
      -webkit-backdrop-filter: blur(20px) saturate(1.2);
      border: 1px solid rgba(95, 240, 200, .25);
      border-radius: 18px;
      padding: 14px 16px;
      display: flex;
      align-items: center;
      gap: 12px;
      transform: translateY(-140%);
      transition: transform .35s cubic-bezier(.32, .72, 0, 1);
      box-shadow: 0 8px 32px rgba(0, 0, 0, .35)
    }




    .toast.show {
      transform: translateY(0)
    }




    .toast .d {
      width: 40px;
      height: 40px;
      border-radius: 50%;
      background-size: cover;
      flex-shrink: 0
    }




    .toast .txt {
      flex: 1;
      font-size: 14px
    }




    .toast .txt b {
      font-family: var(--font-d)
    }




    .toast button {
      padding: 8px 12px;
      border: 0;
      border-radius: 10px;
      font-weight: 700;
      font-size: 13px
    }




    .toast .yes {
      background: var(--signal);
      color: var(--ink)
    }




    .toast .no {
      background: var(--line);
      color: var(--dim);
      margin-left: 6px
    }




    /* profile form + intent chips */
    .field {
      margin-top: 14px
    }




    .field label {
      display: block;
      font-size: 12px;
      color: var(--dim);
      margin-bottom: 6px
    }




    .field input {
      width: 100%;
      padding: 12px 14px;
      border-radius: 12px;
      border: 1px solid var(--line);
      background: rgba(10, 14, 20, .6);
      color: var(--text);
      font-size: 15px;
      outline: none;
      transition: all .2s ease
    }




    .field input:focus {
      border-color: var(--signal);
      box-shadow: 0 0 0 3px rgba(95, 240, 200, .1);
      background: rgba(10, 14, 20, .9)
    }




    .chips {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      margin-top: 6px
    }




    .chip {
      padding: 9px 16px;
      border-radius: 999px;
      border: 1px solid var(--line);
      background: var(--ink);
      color: var(--dim);
      font-family: var(--font-d);
      font-weight: 500;
      font-size: 14px;
      cursor: pointer;
      transition: all .15s ease
    }




    .chip:active {
      transform: scale(.93)
    }




    .chip.sel {
      background: var(--signal);
      color: var(--ink);
      border-color: var(--signal);
      box-shadow: 0 2px 12px rgba(95, 240, 200, .25)
    }




    .intent-badge {
      display: inline-block;
      margin-top: 8px;
      padding: 5px 14px;
      border-radius: 999px;
      background: rgba(95, 240, 200, .1);
      border: 1px solid rgba(95, 240, 200, .2);
      color: var(--signal);
      font-family: var(--font-d);
      font-weight: 600;
      font-size: 13px
    }




    .avatar-lg {
      width: 96px;
      height: 96px;
      border-radius: 50%;
      object-fit: cover;
      background: #1c2536;
      border: 2px solid var(--line);
      display: block;
      margin: 4px auto 0
    }
  </style>
</head>




<body>
  <div id="app">
    <div class="bar">
      <div class="brand">or<span>·</span>bit</div>
      <div style="display:flex;gap:8px">
        <button class="ghost" id="panicBtn" style="background:var(--warn);color:#fff">⚡</button>
        <button class="ghost" id="meBtn">◔ me</button>
        <button class="ghost" id="areaBtn">◎ set area</button>
        <button class="ghost" id="ghostBtn">◐ ghost mode</button>
      </div>
    </div>
    <div id="map"></div>
    <div class="placehint" id="placehint">Tap anywhere to set your area · tap “set area” again to cancel</div>
    <div class="placehint" id="emptyhint" style="top:auto;bottom:76px;border-color:var(--line)">
      You're on the map. When someone nearby is active, they'll appear here — tap them to say hi.
    </div>
    <div class="modes">
      <button id="mRadar" class="active">Radar</button>
      <button id="mHub">Hubs</button>
    </div>
    <div class="sheet" id="sheet">
      <div class="grip"></div>
      <div id="sheetBody"></div>
    </div>
  </div>




  <script type="module">
    /* ============================================================
       ORBIT — base MVP.
       Auth (anonymous) + live location sync + 5-min fuse + chat +
       Feature A (chosen-area / neighborhood mode). All real via Firestore.
       ============================================================ */




    /* ---- Firebase ---- */
    import { initializeApp } from "https://www.gstatic.com/firebasejs/11.0.2/firebase-app.js";
    import { getAuth, signInAnonymously, onAuthStateChanged }
      from "https://www.gstatic.com/firebasejs/11.0.2/firebase-auth.js";
    import { getFirestore, doc, setDoc, getDoc, updateDoc, addDoc, deleteDoc, collection, query, where, orderBy, onSnapshot, serverTimestamp, getDocs }
      from "https://www.gstatic.com/firebasejs/11.0.2/firebase-firestore.js";




    const firebaseConfig = {
      apiKey: "AIzaSyCTM8FsMdKD0-NHfQ7jm6C2ui7B_tMzFO0",
      authDomain: "orbit-mvp-7e75b.firebaseapp.com",
      projectId: "orbit-mvp-7e75b",
      storageBucket: "orbit-mvp-7e75b.firebasestorage.app",
      messagingSenderId: "964170192042",
      appId: "1:964170192042:web:2b66d76eb480a25d4cecd3"
    };




    const fbApp = initializeApp(firebaseConfig);
    const auth = getAuth(fbApp);
    const db = getFirestore(fbApp);   // ready for step 2
    let uid = null;                       // set once we're signed in




    const el = s => document.querySelector(s);
    const rand = (a, b) => a + Math.random() * (b - a);




    /* ---- geo helpers: geohash + fuzzing (safety core) ---- */
    // Only geohash + rounded coords should ever leave the device.
    const B32 = "0123456789bcdefghjkmnpqrstuvwxyz";
    function geohash(lat, lng, p = 7) {
      let idx = 0, bit = 0, even = true, hash = "", latR = [-90, 90], lngR = [-180, 180];
      while (hash.length < p) {
        if (even) { const m = (lngR[0] + lngR[1]) / 2; if (lng >= m) { idx = idx * 2 + 1; lngR[0] = m } else { idx *= 2; lngR[1] = m } }
        else { const m = (latR[0] + latR[1]) / 2; if (lat >= m) { idx = idx * 2 + 1; latR[0] = m } else { idx *= 2; latR[1] = m } }
        even = !even; if (++bit === 5) { hash += B32[idx]; bit = 0; idx = 0 }
      }
      return hash;
    }
    // round to ~20m grid — this is what we'd actually persist
    const fuzz = v => Math.round(v / 0.0002) * 0.0002;
    // haversine distance in meters between two lat/lng points
    function distMeters(lat1, lng1, lat2, lng2) {
      const R = 6371000, toRad = d => d * Math.PI / 180;
      const dLat = toRad(lat2 - lat1), dLng = toRad(lng2 - lng1);
      const a = Math.sin(dLat / 2) ** 2 + Math.cos(toRad(lat1)) * Math.cos(toRad(lat2)) * Math.sin(dLng / 2) ** 2;
      return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a));
    }
    function fmtDist(m) { return m < 1000 ? Math.round(m) + "m away" : (m / 1000).toFixed(1) + "km away"; }
    function fmtSince(ts) { if (!ts) return ""; const min = Math.max(1, Math.round((Date.now() - ts) / 60000)); return min < 60 ? `here ${min} min` : `here ${Math.floor(min / 60)}h ${min % 60}m`; }




    /* ---- state ---- */
    let me = { lat: 19.0760, lng: 72.8777 }; // Mumbai default; overwritten by real GPS
    let ghost = false, mode = "radar", map, myMarker;
    const peerMarkers = {}, hubMarkers = {};




    /* ---- Feature A: chosen area ("neighborhood mode") ---- */
    // When set, we publish this chosen point at neighborhood resolution instead of GPS.
    // Honest: still a real present user, just shown coarser. Real GPS is NOT used while set.
    let area = null;             // {lat,lng} chosen by the user, or null (use GPS)
    let placingArea = false;     // true while waiting for the user to tap the map
    const AREA_FUZZ = 0.005;     // ~500m grid — neighborhood resolution
    let areaRing = null;         // the visible radius circle around my area dot




    /* ---- step 2: real users from Firestore ---- */
    const realMarkers = {};        // uid -> Leaflet marker
    const realUsers = {};          // uid -> {lat,lng,updatedAt}
    let lastWrite = 0;             // throttle: ms timestamp of last location write
    const WRITE_EVERY = 10000;    // write my location at most every 10s (quota safety)
    const STALE_MS = 120000;      // hide anyone not updated in the last 2 min
    let myArrivedAt = null;          // timestamp of when I went live this session




    /* ---- profiles + per-session intent ---- */
    let myProfile = null;          // {name, photoUrl, prompt1, prompt2} loaded from profiles/{uid}
    let sessionIntent = "Open";    // per-session "here to…" — rides on the location broadcast
    const INTENTS = ["Friends", "Coffee", "Dating", "Open"];
    const profileCache = {};       // uid -> profile, so we don't refetch on every dot tap
    const PROMPTS = [              // the two prompt questions users answer
      "I'm down to grab a…",
      "You should say hi if…"
    ];




    const peers = [
      {
        id: "p1", name: "Alex", age: 24, d: "0.1 km", ph: "https://i.pravatar.cc/300?img=12",
        q: "I'm down to grab a...", a: "Matcha, right now"
      },
      {
        id: "p2", name: "Sam", age: 27, d: "0.2 km", ph: "https://i.pravatar.cc/300?img=32",
        q: "Most spontaneous thing...", a: "Booked a flight at 2am"
      },
      {
        id: "p3", name: "Riya", age: 23, d: "0.3 km", ph: "https://i.pravatar.cc/300?img=45",
        q: "Weekend plans?", a: "Finding whoever reads this"
      },
    ];
    const hubs = [
      { id: "h1", name: "Blue Tokai Cafe", emoji: "☕", off: [0.0018, -0.0012] },
      { id: "h2", name: "The Bar Stock", emoji: "🍸", off: [-0.0022, 0.0020] },
      { id: "h3", name: "Kitab Khana", emoji: "📚", off: [0.0008, 0.0028] },
    ];
    const hubCounts = {};       // hubId -> live count of people "here now"
    const hubPresenceUnsubs = {}; // hubId -> unsub for its presence listener
    let currentHub = null;      // hub I'm currently checked into (for cleanup)
    let hubChatUnsub = null;    // active hub chat listener




    const hiddenUids = new Set();
    async function loadBlocks() {
      hiddenUids.clear();
      const [mine, theirs] = await Promise.all([
        getDocs(query(collection(db, "blocks"), where("blockerUid", "==", uid))),

    /* ---- regulars: track sightings in localStorage ---- */
    function trackSighting(otherId) {
      const key = "orbit_sightings";
      const data = JSON.parse(localStorage.getItem(key) || "{}");
      const now = Date.now(), weekAgo = now - 7 * 86400000;
      if (!data[otherId]) data[otherId] = [];
      // only add one sighting per 30 min
      const last = data[otherId][data[otherId].length - 1] || 0;
      if (now - last > 1800000) data[otherId].push(now);
      // prune older than a week
      data[otherId] = data[otherId].filter(t => t > weekAgo);
      localStorage.setItem(key, JSON.stringify(data));
      return data[otherId].length;
    }
    function getSightings(otherId) {
      const data = JSON.parse(localStorage.getItem("orbit_sightings") || "{}");
      const weekAgo = Date.now() - 7 * 86400000;
      return (data[otherId] || []).filter(t => t > weekAgo).length;
    }

      }, err => console.error("hub chat listen failed:", err));
      const send = async () => {
        const text = input.value.trim(); if (!text) return; input.value = "";
        try { await addDoc(msgsRef, { senderId: uid, name: (myProfile && myProfile.name) || "Someone", text, createdAt: Date.now() }); }
        catch (e) { console.error("hub send failed:", e); input.value = text; }
      };
      el("#hcsend").onclick = send;
      input.onkeydown = e => { if (e.key === "Enter") send(); };
    }




    /* listen to every hub's presence so pins show live counts */
    function listenHubs() {
      hubs.forEach(h => {
        if (hubPresenceUnsubs[h.id]) return;
        hubPresenceUnsubs[h.id] = onSnapshot(collection(db, "hubs", h.id, "presence"), snap => {
          let n = 0;
          snap.forEach(d => {
            if (d.id === uid || hiddenUids.has(d.id)) return;
            const ts = d.data().updatedAt?.toMillis?.() ?? 0;
            if (Date.now() - ts <= STALE_MS) n++;   // only count fresh presence
          });
          hubCounts[h.id] = n;
          // update the live count in an open hub sheet, and the pin
          const c = el("#hubCount"); if (c && currentHub === h.id) c.textContent = n;
          if (mode === "hub") renderMode();
        }, err => console.error("hub presence listen failed:", err));
      });
    }




    /* ---- RECEIVER side: listen for incoming requests (step 3) ---- */
    let activeIncoming = null;   // request id currently shown in the toast
    let incomingTick = null;     // countdown interval for the current toast
    /* Fully remove the toast from the page (element + timer). It only exists while a real request is up. */
    function clearIncoming() {
      if (incomingTick) { clearInterval(incomingTick); incomingTick = null; }
      activeIncoming = null;
      const t = el("#toast"); if (t) t.remove();
    }
    function listenForRequests() {
      const q = query(collection(db, "requests"),
        where("receiverId", "==", uid), where("status", "==", "pending"));
      onSnapshot(q, snap => {
        // first still-valid pending request aimed at me (ignore ones already expired)
        let picked = null;
        snap.forEach(d => {
          const r = d.data();
          if (!picked && r.expiresAt && Date.now() < r.expiresAt && !hiddenUids.has(r.senderId)) picked = { id: d.id, ...r };
        });
        if (!picked) {
          clearIncoming();                     // nothing valid -> remove the toast entirely
        } else if (picked.id !== activeIncoming) {
          showIncoming(picked);                // a new valid request -> build & show it
        }
        // if picked.id === activeIncoming, it's already showing; leave it
      }, err => console.error("request listen failed:", err));
    }




    function showIncoming(r) {
      clearIncoming();                         // remove any existing toast first
      activeIncoming = r.id;
      // haptic + sound feedback
      if (navigator.vibrate) navigator.vibrate([80, 40, 80, 40, 120]);
      try { const ctx = new (window.AudioContext || window.webkitAudioContext)(); const o = ctx.createOscillator(); const g = ctx.createGain(); o.connect(g); g.connect(ctx.destination); o.frequency.value = 880; o.type = "sine"; g.gain.value = 0.08; o.start(); g.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.3); o.stop(ctx.currentTime + 0.3); } catch (e) { }
      const p = { name: "Someone nearby", ph: "https://i.pravatar.cc/300?u=" + r.senderId };




      // build the toast element fresh, only now that a real request exists
      const t = document.createElement("div");
      t.className = "toast"; t.id = "toast";
      t.innerHTML = `
    <div class="d" style="background-image:url(${p.ph})"></div>
    <div class="txt"><b>${p.name}</b> wants to say hi. <span id="toastFuse" style="color:var(--warn)"></span></div>
    <div style="display:flex"><button class="yes" id="toastYes">Open</button><button class="no" id="toastNo">Skip</button></div>`;
      el("#app").appendChild(t);
      requestAnimationFrame(() => t.classList.add("show"));  // trigger slide-in




      incomingTick = setInterval(() => {
        const d = r.expiresAt - Date.now();
        if (d <= 0) { clearIncoming(); return; }
        const s = Math.floor(d / 1000);
        const f = el("#toastFuse"); if (f) f.textContent = `${Math.floor(s / 60)}:${String(s % 60).padStart(2, "0")} left`;
      }, 1000);




      el("#toastYes").onclick = async () => {
        clearIncoming();
        // guard: don't accept if it already expired between render and tap
        try {
          const fresh = await getDoc(doc(db, "requests", r.id));
          const cur = fresh.data();
          if (!cur || cur.status !== "pending" || Date.now() > cur.expiresAt) return; // too late
          await updateDoc(doc(db, "requests", r.id), { status: "accepted" });
          openChat(r.id, { name: "Connected", ph: p.ph });
        } catch (e) { console.error("accept failed:", e); }
      };
      el("#toastNo").onclick = async () => {
        clearIncoming();
        // "skip" = silent ignore for the sender (they only ever see it expire),
        // but we mark it dismissed so it stops re-popping the toast on the receiver.
        try { await updateDoc(doc(db, "requests", r.id), { status: "dismissed" }); }
        catch (e) { console.error("dismiss failed:", e); }
      };
    }




    /* ---- controls ---- */
    el("#panicBtn").onclick = async () => {
      ghost = true; const g = el("#ghostBtn"); g.classList.add("on"); g.textContent = "● ghost on";
      if (myMarker) { map.removeLayer(myMarker); myMarker = null; }
      if (areaRing) { map.removeLayer(areaRing); areaRing = null; }
      if (currentHub) await leaveHub(); hideSheet();
      // Remove location from Firestore so other users stop seeing you immediately
      try { await deleteDoc(doc(db, "locations", uid)); } catch (e) { console.error("panic delete failed:", e); }
    };
    el("#meBtn").onclick = () => {
      // quick menu: edit profile or change current intent
      showSheet(`
    <div class="name" style="text-align:center">You</div>
    <div class="meta" style="text-align:center">Currently here to: <b style="color:var(--signal)">${esc(sessionIntent)}</b></div>
    <button class="cta" id="editP" style="margin-top:18px">Edit profile</button>
    <button class="cta" id="changeI" style="background:var(--ink);border:1px solid var(--line);color:var(--text)">Change intent</button>
  `);
      el("#editP").onclick = () => openProfileEditor(false);
      el("#changeI").onclick = () => pickIntent();
    };
    el("#areaBtn").onclick = () => {
      const b = el("#areaBtn"), hint = el("#placehint");
      if (area) {                         // area is set -> clear it, back to live GPS
        area = null; placingArea = false;
        b.classList.remove("on"); b.textContent = "◎ set area";
        hint.classList.remove("show");
        lastWrite = 0; drawMe(); writeMyLocation();
        return;
      }
      placingArea = !placingArea;         // toggle placing mode
      hint.classList.toggle("show", placingArea);
      b.textContent = placingArea ? "◎ tap the map…" : "◎ set area";
    };
    el("#ghostBtn").onclick = () => {
      ghost = !ghost; const b = el("#ghostBtn");
      b.classList.toggle("on", ghost); b.textContent = ghost ? "● ghost on" : "◐ ghost mode"; drawMe()
    };
    el("#mRadar").onclick = () => { mode = "radar"; el("#mRadar").classList.add("active"); el("#mHub").classList.remove("active"); renderMode(); renderRealDots() };
    el("#mHub").onclick = () => { mode = "hub"; el("#mHub").classList.add("active"); el("#mRadar").classList.remove("active"); renderMode(); renderRealDots() };




    /* ---- real GPS: write my location to Firestore (throttled) ---- */
    let watching = false;
    function trackLocation() {
      if (watching) return; watching = true;
      if (!navigator.geolocation) { console.warn("No geolocation"); return; }
      navigator.geolocation.watchPosition(pos => {
        me.lat = pos.coords.latitude; me.lng = pos.coords.longitude;
        if (!area && !placingArea) { map.setView([fuzz(me.lat), fuzz(me.lng)]); drawMe(); }
        listenNearby();             // re-subscribe if geohash prefix changed
        writeMyLocation();          // throttled inside
      }, err => console.warn("GPS:", err.message),
        { enableHighAccuracy: true, timeout: 10000, maximumAge: 0 });
    }




    async function writeMyLocation() {
      if (!uid || ghost) return;               // no identity, or hidden -> don't write
      const now = Date.now();
      if (now - lastWrite < WRITE_EVERY) return; // throttle to protect free-tier quota
      lastWrite = now;




      // Feature A: if the user picked an area, publish THAT at neighborhood resolution.
      // Otherwise publish real GPS at the normal ~20m grid. Either way, exact coords never leave.
      let lat, lng;
      if (area) {
        lat = Math.round(area.lat / AREA_FUZZ) * AREA_FUZZ;
        lng = Math.round(area.lng / AREA_FUZZ) * AREA_FUZZ;
      } else {
        lat = fuzz(me.lat); lng = fuzz(me.lng);
      }
      if (!myArrivedAt) myArrivedAt = Date.now();
      const payload = {
        geohash: geohash(lat, lng),
        lat, lng,
        coarse: !!area,                        // flag so we could show area dots differently later
        intent: sessionIntent,                 // per-session "here to…"
        arrivedAt: myArrivedAt,                // stable per session — when I went live
        updatedAt: serverTimestamp()           // server clock = reliable staleness
      };
      try { await setDoc(doc(db, "locations", uid), payload); }
      catch (e) { console.error("location write failed:", e); }
    }




    /* ---- listen for nearby locations via geohash prefix (~5km radius) ---- */
    let nearbyUnsub = null;
    let currentPrefix = null;
    function listenNearby() {
      const prefix = geohash(me.lat, me.lng, 5);
      if (prefix === currentPrefix) return;  // same cell, keep existing listener
      currentPrefix = prefix;
      if (nearbyUnsub) nearbyUnsub();        // drop old listener


      const q = query(collection(db, "locations"),
        where("geohash", ">=", prefix),
        where("geohash", "<", prefix + "\uf8ff"));
      nearbyUnsub = onSnapshot(q, snap => {
        const seen = new Set();
        snap.forEach(d => {
          if (d.id === uid) return;              // that's me, skip
          if (hiddenUids.has(d.id)) return;
          const u = d.data();
          const ts = u.updatedAt?.toMillis?.() ?? 0;
          if (Date.now() - ts > STALE_MS) return;// stale -> treat as gone
          realUsers[d.id] = { lat: u.lat, lng: u.lng, intent: u.intent || "Open", arrivedAt: u.arrivedAt || 0 };
          seen.add(d.id);
        });
        // drop anyone who vanished from the snapshot or went stale
        Object.keys(realUsers).forEach(id => { if (!seen.has(id)) delete realUsers[id]; });
        renderRealDots();
      }, err => console.error("nearby listen failed:", err));
    }




    function renderRealDots() {
      // remove markers for users no longer present
      Object.keys(realMarkers).forEach(id => {
        if (!realUsers[id]) { map.removeLayer(realMarkers[id]); delete realMarkers[id]; }
      });
      // empty-state hint: only in radar mode, only when nobody real is around
      const hint = el("#emptyhint");
      if (hint) hint.classList.toggle("show", mode === "radar" && Object.keys(realUsers).length === 0);
      if (mode !== "radar") return;              // only show people in Radar mode
      Object.entries(realUsers).forEach(([id, u]) => {
        if (realMarkers[id]) {
          realMarkers[id].setLatLng([u.lat, u.lng]);   // move existing dot
        } else {
          const m = L.marker([u.lat, u.lng], { icon: icon("av pulse real", "") }).addTo(map);
          const av = m.getElement().querySelector(".av");
          av.style.backgroundImage = "url(https://i.pravatar.cc/300?u=" + id + ")"; // stable avatar per uid
          m.on("click", () => openProfile({
            id, name: "Nearby user", d: fmtDist(distMeters(me.lat, me.lng, u.lat, u.lng)),
            ph: "https://i.pravatar.cc/300?u=" + id,
            intent: u.intent, arrivedAt: u.arrivedAt
          }));
          realMarkers[id] = m;
        }
      });
    }




    /* ---- auth status pill (temporary, so you can SEE step 1 working) ---- */
    function setStatus(txt, ok) {
      let p = el("#authpill");
      if (!p) {
        p = document.createElement("div"); p.id = "authpill";
        p.style.cssText = "position:absolute;bottom:74px;left:50%;transform:translateX(-50%);z-index:600;" +
          "font-size:11px;font-family:var(--font-d);padding:6px 12px;border-radius:999px;" +
          "border:1px solid var(--line);background:var(--panel);white-space:nowrap";
        el("#app").appendChild(p);
      }
      p.textContent = txt;
      p.style.color = ok ? "var(--signal)" : "var(--dim)";
      p.style.borderColor = ok ? "var(--signal)" : "var(--line)";
    }




    /* ---- boot: sign in anonymously, THEN start the app ---- */
    let booted = false;
    async function startApp() {
      if (booted) return; booted = true;




      if (!localStorage.getItem("orbit_age_ok")) {
        await new Promise(res => {
          const o = document.createElement("div");
          o.style.cssText = "position:fixed;inset:0;z-index:2000;background:var(--ink);display:flex;flex-direction:column;align-items:center;justify-content:center;padding:32px;text-align:center";
          o.innerHTML = `<div class="brand" style="font-size:28px;margin-bottom:16px">or<span style="color:var(--signal)">·</span>bit</div>
          <div class="meta" style="max-width:320px;margin-bottom:24px">You must be 18 or older. Meet in public, tell a friend, use panic-hide (⚡) if unsafe.</div>
          <button class="cta" id="ageOk" style="max-width:280px">I am 18 or older — continue</button>`;
          document.body.appendChild(o);
          o.querySelector("#ageOk").onclick = () => { localStorage.setItem("orbit_age_ok", "1"); o.remove(); res(); };
        });
      }




      initMap();
      if ('serviceWorker' in navigator) { navigator.serviceWorker.getRegistrations().then(rs => rs.forEach(r => r.unregister())); }




      // load my profile; if none, run first-time setup (which flows into intent + go-live)
      try {
        const snap = await getDoc(doc(db, "profiles", uid));
        if (snap.exists()) { myProfile = snap.data(); profileCache[uid] = myProfile; }
      } catch (e) { console.error("profile load failed:", e); }




      await loadBlocks();
      listenNearby();        // render everyone else's, live
      listenForRequests();   // watch for incoming approach requests
      listenHubs();          // live presence counts for venue pins




      if (!myProfile) {
        openProfileEditor(true);   // first run: set up profile -> intent -> go live
      } else {
        trackLocation();           // returning user: start broadcasting right away
      }
    }




    setStatus("connecting…", false);
    onAuthStateChanged(auth, user => {
      if (user) {
        uid = user.uid;
        console.log("Signed in. uid =", uid);
        setStatus("● you're on · " + uid.slice(0, 6), true);
        startApp();
      }
    });
    signInAnonymously(auth).catch(err => {
      console.error("Auth failed:", err);
      setStatus("auth failed — check console", false);
    });




    // best-effort cleanup: remove my hub presence if I close the tab
    window.addEventListener("beforeunload", () => { if (currentHub) leaveHub(); });
  </script>
